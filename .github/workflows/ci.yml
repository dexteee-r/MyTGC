name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: nothing is learned from finishing a run
# against a commit that is already history.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The development machine runs 3.14 and the LXC will run whatever Debian
        # ships, so both ends are exercised rather than assumed compatible.
        python: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Tests
        # The suite runs against a throwaway database in a temp directory, so it
        # needs neither the catalogue nor the 2.5 GB image cache.
        run: python -m pytest backend -c backend/pytest.ini

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 refuses anything below 20.19 / 22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Typecheck and build
        # `build` runs tsc first, so a type error fails here rather than in
        # production.
        run: npm run build --prefix frontend
