# MyTCG — Nginx site, fronted by a Cloudflare Tunnel.
#
# TLS terminates at Cloudflare, so this listens on plain HTTP and only on the
# loopback: cloudflared connects from the same machine, and nothing else should be
# able to reach it. Do not change this to 0.0.0.0 without a reason.
#
# Everything is served from one origin — the built frontend at /, the API under
# /api. That is deliberate: same origin means no CORS to maintain and the httpOnly
# refresh cookie simply works, without the SameSite gymnastics a split origin needs.

# Cloudflare sends the original scheme. Fall back to our own only if it is absent,
# so the API can tell an HTTPS visitor from a plain-HTTP one — the refresh cookie's
# Secure flag depends on it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 127.0.0.1:80;
    server_name mytcg.elmzn.be;

    root /srv/mytcg/frontend;
    index index.html;

    # A scan upload is a full-resolution frame; the API refuses anything over 20 MB
    # itself, so this only needs to be a little larger.
    client_max_body_size 25m;

    access_log /var/log/nginx/mytcg.access.log;
    error_log  /var/log/nginx/mytcg.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # --- security headers ---------------------------------------------------
    # The app bundles everything it needs and talks to no third party, so the
    # policy can be tight. 'unsafe-inline' is present for styles only, because the
    # card colour spines and the collection chart are set through React style
    # attributes; scripts have no such exemption.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- card art -----------------------------------------------------------
    # 2.5 GB of static PNGs. Served straight from disk rather than through Python:
    # they never change, and they are the bulk of the traffic while browsing a set.
    location /api/images/ {
        alias /var/lib/mytcg/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        # The trailing slash strips the /api prefix, matching what the Vite dev
        # proxy does, so the client uses the same paths in both environments.
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Detection, deskew and hashing on a full frame take a moment.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # --- frontend -----------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Single-page app: every unknown path is a client-side route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
